<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Mindline</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<style>
body{
  font-family:'DM Sans',sans-serif;
  margin:0;
  background:#F9F4EF;
}
#root{
  max-width:420px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

#onboarding{
  position:fixed;
  inset:0;
  background:#5758A6;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
}

#main-app{display:none;flex:1;flex-direction:column}
#bottomNav{display:none}

.timeline{
  flex:1;
  padding:20px;
}
.tcard{
  background:white;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
  font-size:14px;
}
</style>
</head>

<body>

<div id="root">

<!-- ONBOARDING -->
<div id="onboarding">
  <h1 style="font-family:Fraunces">Mindline ✦</h1>
  <button id="startBtn" style="padding:10px 20px;border-radius:10px;border:none">Start</button>
</div>

<!-- APP -->
<div id="main-app">

  <div style="padding:16px;font-weight:700">App Loaded 🚀</div>

  <div class="timeline" id="timeline"></div>

</div>

</div>

<!-- NAV -->
<div id="bottomNav">NAV</div>

<script>

let thoughts = [
  {text:"Export finance report ke Excel"},
  {text:"Gym jam 7 malam"},
  {text:"Riset AI tools"}
];

// =======================
// RENDER APP (INI WAJIB)
// =======================

function renderTimeline(){
  const el = document.getElementById("timeline");
  if(!el) return;

  el.innerHTML = thoughts.map(t =>
    `<div class="tcard">${t.text}</div>`
  ).join("");
}

// =======================
// INIT APP SAFE
// =======================

function initApp(){
  const onboard = document.getElementById("onboarding");
  const main = document.getElementById("main-app");
  const nav = document.getElementById("bottomNav");

  if(localStorage.getItem("mindline_done")){
    onboard.style.display="none";
    main.style.display="flex";
    nav.style.display="flex";
    renderTimeline(); // 🔥 IMPORTANT
  }
}

// =======================
// FINISH ONBOARDING
// =======================

function finishOnboarding(){
  localStorage.setItem("mindline_done","1");

  document.getElementById("onboarding").style.display="none";
  document.getElementById("main-app").style.display="flex";
  document.getElementById("bottomNav").style.display="flex";

  renderTimeline(); // 🔥 FIX BLANK PAGE
}

// =======================
// BOOT
// =======================

window.addEventListener("DOMContentLoaded", () => {

  initApp();

  document.getElementById("startBtn").onclick = () => {
    finishOnboarding();
  };

});

</script>

</body>
</html>
