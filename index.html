<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Mindline</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<style>
/* =======================
   (CSS KAMU TETAP SAMA)
   ======================= */

body{font-family:'DM Sans',sans-serif;background:#F9F4EF;margin:0}
#root{max-width:420px;margin:auto;min-height:100vh;display:flex;flex-direction:column}

/* onboarding minimal fix */
#onboarding{position:fixed;inset:0;background:#5758A6;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:999}
#main-app{display:none;flex:1;flex-direction:column}
#bottomNav{display:none}
</style>
</head>

<body>

<div id="root">

<!-- ONBOARDING -->
<div id="onboarding">
  <h1 style="font-family:Fraunces">Mindline ✦</h1>
  <button id="startBtn">Start</button>
</div>

<!-- MAIN APP -->
<div id="main-app">

  <h2 style="padding:20px">App Loaded 🚀</h2>

</div>

</div>

<!-- NAV -->
<div id="bottomNav">
  Bottom Nav
</div>

<script>
// =======================
// SAFE INIT (INI FIX UTAMA)
// =======================

function initApp(){
  const onboard = document.getElementById("onboarding");
  const main = document.getElementById("main-app");
  const nav = document.getElementById("bottomNav");

  if(localStorage.getItem("mindline_done")){
    onboard.style.display="none";
    main.style.display="flex";
    nav.style.display="flex";
  }
}

// =======================
// ONBOARDING COMPLETE
// =======================

function finishOnboarding(){
  localStorage.setItem("mindline_done","1");

  document.getElementById("onboarding").style.display="none";
  document.getElementById("main-app").style.display="flex";
  document.getElementById("bottomNav").style.display="flex";
}

// =======================
// EVENTS (SAFE DOM READY)
// =======================

window.addEventListener("DOMContentLoaded", () => {

  initApp();

  document.getElementById("startBtn").onclick = () => {
    finishOnboarding();
  };

});

</script>

</body>
</html>
