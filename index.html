<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Mindline</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F9F4EF}
#root{max-width:420px;margin:auto;min-height:100vh;display:flex;flex-direction:column}

#onboarding{
  position:fixed;inset:0;background:#5758A6;color:#fff;
  display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:999;
}

#main-app{display:none;flex:1;flex-direction:column}
#bottomNav{display:none}

.timeline{padding:16px}
.card{background:#fff;padding:12px;border-radius:12px;margin-bottom:10px}
</style>
</head>

<body>

<div id="root">

<!-- ONBOARDING -->
<div id="onboarding">
  <h1 style="font-family:Fraunces">Mindline ✦</h1>
  <button id="startBtn">Start</button>
</div>

<!-- APP -->
<div id="main-app">
  <div style="padding:16px;font-weight:700">App Loaded 🚀</div>
  <div class="timeline" id="timeline"></div>
</div>

</div>

<div id="bottomNav">NAV</div>

<script>

let thoughts = [
  {text:"Export report ke Excel"},
  {text:"Gym jam 7 malam"},
  {text:"Riset AI tools"}
];


// =======================
// SAFE RENDER
// =======================

function renderTimeline(){
  const el = document.getElementById("timeline");
  if(!el) return;

  el.innerHTML = thoughts.map(t =>
    `<div class="card">${t.text}</div>`
  ).join("");
}


// =======================
// SAFE BOOT
// =======================

function bootApp(){
  try {
    renderTimeline();
  } catch(e){
    console.log("render error:", e);
  }
}


// =======================
// INIT SAFE (SAFARI FIX)
// =======================

function init(){
  const onboard = document.getElementById("onboarding");
  const main = document.getElementById("main-app");
  const nav = document.getElementById("bottomNav");

  if(!onboard || !main || !nav) return;

  try {
    const done = localStorage.getItem("mindline_done");

    if(done === "1"){
      onboard.style.display="none";
      main.style.display="flex";
      nav.style.display="flex";

      setTimeout(()=>bootApp(),50);
    }
  } catch(e){
    console.log("storage error:", e);
  }
}


// =======================
// FINISH ONBOARDING
// =======================

function finish(){
  try {
    localStorage.setItem("mindline_done","1");
  } catch(e){
    console.log("storage blocked");
  }

  const onboard = document.getElementById("onboarding");
  const main = document.getElementById("main-app");
  const nav = document.getElementById("bottomNav");

  if(onboard) onboard.style.display="none";
  if(main) main.style.display="flex";
  if(nav) nav.style.display="flex";

  setTimeout(()=>bootApp(),50);
}


// =======================
// STARTUP SAFE (SAFARI FIX)
// =======================

window.addEventListener("DOMContentLoaded", function(){

  try {
    init();

    const btn = document.getElementById("startBtn");
    if(btn){
      btn.addEventListener("click", finish);
    }

  } catch(e){
    console.log("fatal init error:", e);
  }

});

</script>

</body>
</html>
