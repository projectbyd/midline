<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Mindline</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<style>
:root{
  --blue:#5758A6;--blue-light:#EEEEF8;--blue-mid:#8485C0;
  --sand:#E7C58A;--sand-d:#C4993A;
  --green:#86B05D;--rose:#C77974;
  --bg:#F9F4EF;--white:#FFF;--border:#EBE0D5;
  --text:#2E1F1F;--text2:#7A6060;--text3:#A89090;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  display:flex;
  justify-content:center;
}
#root{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}

/* HEADER */
.header{
  padding:18px 16px 0;
}
.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.cat-tab{
  background:var(--blue-light);
  color:var(--blue);
  padding:8px 12px;
  border-radius:12px;
  font-weight:800;
  font-size:13px;
  cursor:pointer;
}
.search-btn{
  font-size:18px;
  cursor:pointer;
  padding:6px 10px;
}
.logo{
  font-family:'Fraunces',serif;
  font-size:26px;
  margin-top:6px;
}

/* COMPOSER */
.composer{
  margin:14px 16px;
  background:#fff;
  border-radius:16px;
  padding:12px;
  border:1px solid var(--border);
}
textarea{
  width:100%;
  border:none;
  outline:none;
  resize:none;
}
.comp-actions{
  display:flex;
  gap:8px;
  margin-top:10px;
}
button{
  cursor:pointer;
}

/* STORIES */
.stories{
  padding:10px 16px;
  display:flex;
  gap:10px;
  overflow-x:auto;
}
.story{
  min-width:70px;
  text-align:center;
  cursor:pointer;
}
.story-circle{
  width:50px;height:50px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

/* TIMELINE */
.timeline{
  padding:10px 16px 90px;
  flex:1;
  overflow-y:auto;
}
.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
}
.card small{color:var(--text3)}
.card-text{margin-top:6px}

/* MODAL */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.4);
  display:flex;
  align-items:flex-end;
}
.sheet{
  background:#fff;
  width:100%;
  border-radius:20px 20px 0 0;
  padding:16px;
}
</style>
</head>

<body>
<div id="root">

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div id="catTabBtn" class="cat-tab">📂 Categories</div>
    <div id="searchBtn" class="search-btn">🔍</div>
  </div>
  <div class="logo">Mindline ✦</div>
</div>

<!-- COMPOSER -->
<div class="composer">
  <textarea id="input" rows="2" placeholder="What's on your mind?"></textarea>
  <div class="comp-actions">
    <button onclick="post()">Post</button>
  </div>
</div>

<!-- STORIES -->
<div class="stories" id="stories"></div>

<!-- TIMELINE -->
<div class="timeline" id="timeline"></div>

</div>

<script>
// ================= STATE =================
let cats=[
  {id:"c1",name:"Work",emoji:"💼",color:"#5758A6"},
  {id:"c2",name:"Personal",emoji:"🌿",color:"#86B05D"}
];

let thoughts=[
  {id:1,text:"Finish laporan project",catId:"c1",at:new Date()},
  {id:2,text:"Gym jam 7 malam",catId:"c2",at:new Date()}
];

let selectedCat=null;

// ================= HELPERS =================
const uid=()=>Date.now()+Math.random().toString(16).slice(2);

// ================= RENDER CATS =================
function renderCats(){
  let el=document.getElementById("stories");
  el.innerHTML=cats.map(c=>`
    <div class="story" onclick="filterCat('${c.id}')">
      <div class="story-circle" style="background:${c.color}22">${c.emoji}</div>
      <div style="font-size:11px">${c.name}</div>
    </div>
  `).join("");
}

// ================= FILTER =================
function filterCat(id){
  selectedCat = selectedCat===id?null:id;
  render();
}

// ================= POST =================
function post(){
  let t=document.getElementById("input").value.trim();
  if(!t)return;

  thoughts.unshift({
    id:uid(),
    text:t,
    catId:selectedCat||cats[0].id,
    at:new Date()
  });

  document.getElementById("input").value="";
  render();
}

// ================= RENDER =================
function render(){
  renderCats();

  let list=selectedCat
    ? thoughts.filter(t=>t.catId===selectedCat)
    : thoughts;

  document.getElementById("timeline").innerHTML=list.map(t=>{
    let c=cats.find(x=>x.id===t.catId);

    return `
    <div class="card">
      <small>${c.emoji} ${c.name} • ${t.at.toLocaleString()}</small>
      <div class="card-text">${t.text}</div>
    </div>
    `;
  }).join("");
}

// ================= HEADER ACTIONS =================
document.getElementById("catTabBtn").onclick=()=>{
  let name=prompt("Nama kategori baru:");
  if(!name)return;
  cats.push({id:uid(),name,emoji:"📂",color:"#5758A6"});
  render();
};

document.getElementById("searchBtn").onclick=()=>{
  alert("Search mode (bisa kamu upgrade nanti)");
};

// INIT
render();
</script>

</body>
</html>
